[project]
name = "resumable-evals"
version = "0.0.1"
description = "Record and rebuild: resume eval episodes that fail mid-run without changing harnesses or agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumable_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
